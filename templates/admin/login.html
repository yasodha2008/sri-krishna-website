<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Admin Login | Sri Krishna Flower Shop
    </title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f8eee4,
                    #fffaf5,
                    #efe1d2
                );

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                20px;

        }


        .login-container {

            width:
                100%;

            max-width:
                420px;

        }


        .login-card {

            background:
                rgba(255,255,255,.96);

            border-radius:
                28px;

            padding:
                42px;

            box-shadow:
                0 25px 70px
                rgba(70,45,25,.14);

            border:
                1px solid #eadfd5;

        }


        .logo {

            width:
                70px;

            height:
                70px;

            margin:
                0 auto 20px;

            border-radius:
                50%;

            background:
                #f4e5d5;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                34px;

        }


        h1 {

            text-align:
                center;

            font-family:
                Georgia,
                serif;

            color:
                #4d2d1b;

            font-size:
                30px;

        }


        .subtitle {

            text-align:
                center;

            color:
                #958174;

            font-size:
                13px;

            margin-top:
                7px;

            margin-bottom:
                30px;

        }


        .error {

            background:
                #fff0ee;

            color:
                #a34f45;

            border:
                1px solid #f0d0cb;

            border-radius:
                10px;

            padding:
                11px;

            font-size:
                13px;

            margin-bottom:
                18px;

            text-align:
                center;

        }


        .form-group {

            margin-bottom:
                18px;

        }


        label {

            display:
                block;

            color:
                #5b4030;

            font-size:
                13px;

            font-weight:
                600;

            margin-bottom:
                7px;

        }


        input {

            width:
                100%;

            padding:
                14px 15px;

            border:
                1px solid #dfd0c1;

            border-radius:
                12px;

            outline:
                none;

            font-size:
                14px;

            background:
                #fffdfb;

            color:
                #3d2a1e;

            transition:
                .2s;

        }


        input:focus {

            border-color:
                #9b7452;

            box-shadow:
                0 0 0 3px
                rgba(155,116,82,.10);

        }


        .login-button {

            width:
                100%;

            border:
                none;

            padding:
                15px;

            border-radius:
                13px;

            background:
                #68452e;

            color:

            font-size:
                15px;

            font-weight:
                600;

            cursor:
                pointer;

            margin-top:
                7px;

            transition:
                .25s;

        }


        .login-button:hover {

            background:
                #513520;

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(80,50,30,.18);

        }


        .back {

            display:
                block;

            text-align:
                center;

            margin-top:

            color:
                #927763;

            font-size:

            text-decoration:

        }


        .back:hover {

            color:
                #5e3d27;

        }


        .security {

            margin-top:
                25px;

            padding-top:

            text-align:
                center;

            font-size:
                11px;

            color:
                #a18f82;

        }


        @media (max-width: 500px) {

            .login-card {

                padding:
                    30px 22px;

                border-radius:
                    22px;

            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <div class="logo">
            🌸
        </div>


        <h1>
            Admin Login
        </h1>


        <div class="subtitle">
            Sri Krishna Flower Shop
        </div>


        {% if error %}

        <div class="error">

            {{ error }}

        </div>

        {% endif %}


        <form
            method="POST"
            action="/admin"
        >


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Login to Dashboard
            </button>


        </form>


        <a
            href="/"
            class="back"
        >
            ← Back to Flower Shop
        </a>


        <div class="security">
            🔒 Admin access only
        </div>


    </div>

</div>


</body>

</html>
```
